<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversa Terapia | Cursos de Rafa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 20px 0;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .course-card {
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            text-align: left;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .course-card:hover {
            background-color: #262626;
            transform: translateY(-2px);
        }
        .course-thumb {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 16px;
            flex-shrink: 0;
            background-color: #333; /* Fundo caso a imagem demore */
        }
        .course-info {
            flex-grow: 1;
        }
        .course-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .course-action {
            font-size: 0.85rem;
            color: #4CAF50;
            font-weight: 500;
        }
        footer {
            margin-top: auto;
            font-size: 0.8rem;
            color: #666;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Conversa Terapia</h1>
        <p class="subtitle">Conheça meus cursos e aperfeiçoe seu desenvolvimento</p>

        <!-- CURSO 1: Psicologia -->
        <a href="LINK_DO_SEU_CURSO_DE_PSICO" class="course-card" target="_blank">
            <img src="URL_DA_CAPA_PSICO.jpg" alt="Curso de Psicologia" class="course-thumb">
            <div class="course-info">
                <div class="course-title">Curso de Psicologia</div>
                <div class="course-action">Acessar curso &rarr;</div>
            </div>
        </a>

        <!-- CURSO 2: Excel -->
        <a href="LINK_DO_CURSO_DE_EXCEL" class="course-card" target="_blank">
            <img src="URL_DA_CAPA_EXCEL.jpg" alt="Curso de Excel" class="course-thumb">
            <div class="course-info">
                <div class="course-title">Curso de Excel Avançado / VBA</div>
                <div class="course-action">Acessar curso &rarr;</div>
            </div>
        </a>

        <!-- CURSO 3: Gestão de Pessoas -->
        <a href="LINK_DO_CURSO_GESTAO" class="course-card" target="_blank">
            <img src="URL_DA_CAPA_GESTAO.jpg" alt="Gestão de Pessoas e Trabalho" class="course-thumb">
            <div class="course-info">
                <div class="course-title">Gestão de Pessoas e Trabalho</div>
                <div class="course-action">Acessar curso &rarr;</div>
            </div>
        </a>
    </div>

    <footer>
        &copy; Conversa Terapia. Todos os direitos reservados.
    </footer>

</body>
</html>
